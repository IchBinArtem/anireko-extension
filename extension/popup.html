<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="extensionName">AniReko</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="brand">
        <img class="brand-mark" src="brand-mark.svg" alt="" aria-hidden="true">
        <div>
          <h1>AniReko</h1>
          <span data-i18n="brandTagline"></span>
        </div>
      </header>
      <section class="privacy-disclosure" id="privacy-disclosure" hidden>
        <strong data-i18n="privacyDisclosureTitle"></strong>
        <ul>
          <li data-i18n="privacyDisclosureLocalRead"></li>
          <li data-i18n="privacyDisclosureMatch"></li>
          <li data-i18n="privacyDisclosureSync"></li>
          <li data-i18n="privacyDisclosureReport"></li>
        </ul>
        <label><input type="checkbox" id="diagnostics-consent"> <span data-i18n="diagnosticsConsent"></span></label>
        <div class="privacy-actions">
          <button id="privacy-accept" type="button" data-i18n="privacyAccept"></button>
          <button id="privacy-decline" class="secondary" type="button" data-i18n="privacyDecline"></button>
        </div>
        <a id="privacy-policy" target="_blank" rel="noopener" data-i18n="privacyPolicy"></a>
      </section>
      <section class="checks" data-i18n-aria-label="recognitionStateAria">
        <div class="check-card anime-card pending" id="anime-check">
          <span class="check-icon" aria-hidden="true">·</span>
          <div class="check-copy">
            <strong id="anime-check-title" data-i18n="findingAnimePage"></strong>
            <span id="anime-check-detail" data-i18n="checkingPageMetadata"></span>
            <div class="recognized-only">
              <h2 id="title">—</h2>
              <p class="anime-meta"><span id="episode">—</span><span aria-hidden="true">·</span><span id="voice">—</span></p>
              <p class="taste-match" id="taste-match">—</p>
              <a class="primary-action" id="anime-primary-action" hidden target="_blank" rel="noopener"><span data-i18n="openInAniReko"></span> <span aria-hidden="true">→</span></a>
              <p class="catalog-note" id="anireko-match">—</p>
            </div>
          </div>
        </div>
        <div class="check-card pending" id="player-check">
          <span class="check-icon" aria-hidden="true">·</span>
          <div class="check-copy">
            <strong id="player-check-title" data-i18n="findingVideoPlayer"></strong>
            <span id="player-check-detail" data-i18n="checkingAvailableFrames"></span>
            <div class="playback-summary">
              <span class="status-chip" id="status">—</span>
              <strong id="progress">—</strong>
              <span class="player-tech"><span id="player">—</span><span aria-hidden="true">·</span><span id="player-count">—</span><span id="player-count-label"></span></span>
            </div>
          </div>
        </div>
      </section>
      <section class="not-found-report" id="not-found-report" hidden>
        <button id="report-anime-miss" type="button" data-i18n="reportAnimeMiss"></button>
        <p id="report-anime-miss-detail" data-i18n="reportAnimeMissDetail"></p>
      </section>
      <section class="stats-card" id="stats-card" data-i18n-aria-label="localStatsAria">
        <div class="stats-head">
          <span data-i18n="today"></span>
          <strong id="today-time" data-i18n="zeroMinutes"></strong>
          <span aria-hidden="true">·</span>
          <strong id="today-episodes" data-i18n="zeroEpisodes"></strong>
          <span class="local-pill" data-i18n="locally"></span>
        </div>
        <div class="week-chart" id="week-chart" data-i18n-aria-label="lastSevenDaysAria"></div>
      </section>
      <section class="resume-card" id="anime-fields">
        <span id="resume-label" hidden data-i18n="resumeLabel"></span>
        <strong id="resume" hidden>—</strong>
      </section>
      <p class="hint" id="hint" data-i18n="localHistoryHint"></p>
      <div class="account" id="account">
        <span id="account-label" data-i18n="checkingAccount"></span>
        <a id="account-login" hidden target="_blank" rel="noopener" data-i18n="loginOnSite"></a>
        <button id="resume-sync" type="button" data-i18n="syncButton" data-i18n-title="syncButtonTitle"></button>
      </div>
      <p class="account-warning" id="account-warning" hidden></p>
      <label class="automark" id="automark">
        <input type="checkbox" id="auto-mark" disabled>
        <span data-i18n="syncDescription"></span>
      </label>
      <div class="privacy-controls">
        <a id="privacy-link" target="_blank" rel="noopener" data-i18n="privacyShort"></a>
        <button id="delete-local-data" type="button" disabled data-i18n="deleteLocalData"></button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
